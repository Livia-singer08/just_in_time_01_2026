<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just in Time | Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <h1>Just <span>in Time</span></h1>
            <p>Gestão de Produção MDF</p>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="produtos.html" class="ativo">Produtos</a></li>
                <li><a href="producao.html">Produção</a></li>
                <li>
                    <button id="logout" class="btn-logout">
                        Sair
                    </button>
                </li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="pagina-topo">
            <div>
                <p class="subtitulo">ESTOQUE</p>
                <h2>Cadastro de Produtos</h2>
                <p>
                    Gerencie os produtos utilizados na produção.
                </p>
            </div>

            <button class="btn" onclick="abrirModal()">
                + Novo Produto
            </button>
        </section>

        <section class="produtos">

            <div class="barra-pesquisa">
                <input
                    type="text"
                    id="busca"
                    placeholder="Digite o nome ou descrição do produto..."
                >

                <button id="btn-buscar">
                    Buscar
                </button>
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Produto</th>
                            <th>Descrição</th>
                            <th>Custo</th>
                            <th>Estoque</th>
                            <th>Mínimo</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabela-produtos">
                        <tr>
                            <td colspan="7">
                                Carregando produtos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>

    </main>

    <div class="modal" id="modal-produto">

        <div class="modal-content">

            <div class="modal-header">
                <h2 id="titulo-modal">
                    Novo Produto
                </h2>

                <button
                    type="button"
                    class="btn-fechar"
                    id="fechar-modal">
                    ×
                </button>
            </div>

            <form id="form-produto">

                <div class="campo">
                    <label for="nome">
                        Nome do produto
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Ex.: Nicho de MDF"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="descricao">
                        Descrição
                    </label>

                    <textarea
                        id="descricao"
                        placeholder="Descrição do produto"
                    ></textarea>
                </div>

                <div class="campo">
                    <label for="custo">
                        Custo
                    </label>

                    <input
                        type="number"
                        id="custo"
                        min="0"
                        step="0.01"
                        placeholder="0,00"
                        required
                    >
                </div>

                <div class="form-duplo">

                    <div class="campo">
                        <label for="quantidadeEstoque">
                            Quantidade em estoque
                        </label>

                        <input
                            type="number"
                            id="quantidadeEstoque"
                            min="0"
                            placeholder="0"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="estoqueMinimo">
                            Estoque mínimo
                        </label>

                        <input
                            type="number"
                            id="estoqueMinimo"
                            min="0"
                            placeholder="0"
                            required
                        >
                    </div>

                </div>

                <div class="modal-botoes">

                    <button
                        type="button"
                        class="btn-cancelar"
                        id="cancelar-modal">
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn">
                        Salvar Produto
                    </button>

                </div>

            </form>

        </div>

    </div>

    <footer>
        <p>© 2026 Just in Time - Gestão de Produção MDF</p>
    </footer>

    <script src="produtos.js"></script>
</body>
</html>
